name: Push gem

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  push:
    name: Push hutch to RubyGems.org
    # Tags pushed in a fork must not attempt a release
    if: github.repository == 'ruby-amqp/hutch'
    runs-on: ubuntu-latest

    concurrency:
      group: push-gem
      cancel-in-progress: false

    environment:
      name: release
      url: https://rubygems.org/gems/hutch

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify the tag matches Hutch::VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(ruby -Ilib -rhutch/version -e 'print Hutch::VERSION')"

      # Built before the push so that a broken gemspec fails the job
      # before the MRI gem is published
      - name: Build the java platform variant
        run: GEM_PLATFORM=java gem build -o hutch-java.gem hutch.gemspec

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      # release-gem leaves the RubyGems credentials configured for the job.
      # It only attests the gem it pushes itself, so sign this one here to
      # give both variants the same provenance.
      - name: Push the java platform variant
        run: |
          gem exec sigstore-cli:0.2.3 sign hutch-java.gem --bundle hutch-java.gem.sigstore.json
          gem push --attestation hutch-java.gem.sigstore.json hutch-java.gem

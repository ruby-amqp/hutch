name: Push gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    name: Push hutch to RubyGems.org
    # Tags pushed in a fork must not attempt a release
    if: github.repository == 'ruby-amqp/hutch'
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://rubygems.org/gems/hutch

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1

      # release-gem leaves the RubyGems credentials configured for the job
      - name: Push the java platform variant
        run: |
          GEM_PLATFORM=java gem build hutch.gemspec
          gem push hutch-*-java.gem
